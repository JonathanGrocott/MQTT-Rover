[package]
name = "mqtt-rover"
version = "0.1.0"
description = "MQTT Rover desktop shell"
authors = ["MQTT Rover"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rumqttc = "0.25.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
